        - "Statistical Modeling"
        - "SAP"
        - "Lean Six Sigma"

  experience:
    enable: true
    items:
      - company: "JCB India, Pune, India"
        jobs:
          - name: "Business Analyst (Assistant Manager), Supplier Quality & Analytics"
            date: "Jul 2023 - Jul 2026"
            content: |
              - Gathered requirements from internal stakeholders and led root-cause analysis with 20+ international and domestic suppliers, driving process improvements at supplier plants.
              - Analyzed field failure data and performance metrics across 20+ supplier accounts using SQL, Power BI and statistical analysis to isolate key drivers, recommending targeted improvements that reduced commodity issues PPM by 79% (2024-2025).
              - Built a Power BI dashboard monitoring leakages, turning raw quality data into recommendations for stakeholder presentations and cutting leakages by 48% (75% at four key suppliers).
              - Developed automated dashboards to track A-class component replacements, proposing process fixes to stakeholders that cut replacements by 40%+ (2024-mid-2026).
              - Ran biweekly fluid contamination tracking in Power BI, consolidating performance reports to test hypotheses, locate root causes, and partner with plant leaders to eliminate issues at the 2 underperforming facilities.

