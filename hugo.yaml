  about:
    enable: true
    title: "About Me"
    content: |-
      I spent three years as a Business Analyst on the Supplier Quality & Analytics team at JCB India. I gathered requirements from internal stakeholders, led root-cause analysis with 20+ international and domestic suppliers, and built automated Power BI dashboards and KPI trackers that reduced commodity issues PPM by 79%, leakages by 48%, and A-class component replacements by 40%+.

      I'm now pursuing an MS in Business Analytics and Information Management at Purdue's Daniels School of Business, adding Python, predictive modeling and database skills to my SQL and Power BI foundation. Recent projects include an ad click prediction model and an industry practicum building a data pipeline and inventory planner for a small-business client. I'm looking for Summer 2027 internships in business analysis, BI engineering and product analytics.
    skills:
      enable: true
