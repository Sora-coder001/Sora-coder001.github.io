  about:
    enable: true
    title: "About Me"
    content: |-
      I spent three years as a Business Analyst on the Supplier Quality & Analytics team at JCB India. I gathered requirements from internal stakeholders, analyzed failure and performance data across 20+ supplier accounts, and turned the findings into dashboards and recommendations that cross-functional teams acted on.

      I'm now in the one-year MS in Business Analytics and Information Management at Purdue's Daniels School of Business, adding data mining, forecasting and modeling to the SQL, Power BI and Python I already use. I'm looking for Summer 2027 internships in business analysis, BI engineering and product analytics.
    skills:
      enable: true
      title: "Tools I work with:"
      items:
        - "Power BI"
        - "SQL"
        - "Excel"
        - "Python (Pandas, NumPy, Matplotlib, Seaborn)"
        - "TensorFlow"

  experience:
    enable: true
    items:
      - company: "JCB India, Pune, India"
        jobs:
          - name: "Business Analyst, Supplier Quality & Analytics"
            date: "Jul 2023 - Jul 2026"
            content: |
              - Gathered requirements from internal stakeholders and led cross-functional root-cause analysis with 20+ supplier teams on part defects, driving process improvements at supplier plants.
              - Analyzed field failure data and performance metrics across 20+ supplier accounts using SQL and Power BI to isolate key drivers, recommending targeted improvements that reduced commodity issues PPM by 79% (2024-2025).
              - Built a Power BI dashboard monitoring leakages, turning raw quality data into recommendations for stakeholder presentations and cutting leakages by 48% (75% at four key suppliers).
              - Developed automated dashboards to track A-class component replacements, proposing process fixes to stakeholders that cut replacements by 40%+ (2024-mid-2026).
              - Ran biweekly fluid contamination tracking in Power BI, consolidating supplier and incoming quality reports to pinpoint root causes and recommend supplier-end process improvements, eliminating concerns at the 2 worst-performing plants.

